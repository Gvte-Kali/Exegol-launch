# Package metadata for users who prefer installing with pip.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Exegol-launch"
version = "0.1.0"
description = "Graphical application launcher running inside Exegol"
requires-python = ">=3.10"
dependencies = []

# Generate the launch command when installing the Python package.
[project.scripts]
launch = "exegol_launch.cli:main"

# Distribute application code only, excluding the tests directory.
[tool.setuptools.packages.find]
include = ["exegol_launch*"]
